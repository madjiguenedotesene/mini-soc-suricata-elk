apiVersion: 1
datasources:
  - name: Suricata (Elasticsearch)
    type: elasticsearch
    access: proxy
    url: https://es01:9200
    basicAuth: true
    basicAuthUser: elastic
    isDefault: true
    jsonData:
      index: "filebeat-*"
      timeField: "@timestamp"
      tlsAuthWithCACert: true
    secureJsonData:
      basicAuthPassword: $ELASTIC_PASSWORD
      tlsCACert: $__file{/etc/grafana/certs/ca/ca.crt}
