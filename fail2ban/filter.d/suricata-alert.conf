# Fail2Ban – filtre des alertes Suricata (eve.json)
#
# Ne bannit que les alertes de sévérité 1 ou 2 (attaques avérées : brute-force,
# scan, exploitation web). Les alertes informatives (sévérité 3, ex. ICMP) sont
# ignorées pour éviter de bannir des sources légitimes.

[Definition]
failregex = "event_type":"alert","src_ip":"<HOST>",.*"alert":\{.*"severity":[12][,}]
ignoreregex =

datepattern = "timestamp":"%%Y-%%m-%%dT%%H:%%M:%%S\.%%f%%z"
