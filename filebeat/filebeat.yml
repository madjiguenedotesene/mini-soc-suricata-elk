# Filebeat : lit eve.json produit par Suricata et l'envoie à Elasticsearch (TLS)

filebeat.modules:
  - module: suricata
    eve:
      enabled: true
      var.paths: ["/var/log/suricata/eve.json"]

# Tableaux de bord Suricata prêts à l'emploi dans Kibana
setup.dashboards.enabled: true
setup.kibana:
  host: "http://kibana:5601"
  username: "elastic"
  password: "${ELASTIC_PASSWORD}"

output.elasticsearch:
  hosts: ["https://es01:9200"]
  username: "elastic"
  password: "${ELASTIC_PASSWORD}"
  ssl.certificate_authorities: ["/usr/share/filebeat/certs/ca/ca.crt"]

processors:
  - add_host_metadata: ~
